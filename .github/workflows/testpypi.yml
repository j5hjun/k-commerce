name: Python compatibility and TestPyPI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  # Serialize reservation, persistence and publication; never cancel an active release.
  # PRs have independent groups and never publish.
  group: testpypi-${{ github.event_name == 'push' && 'dev-publish' || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('manual-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.9.25"

jobs:
  reserve:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.reserve.outputs.revision }}
      publish: ${{ steps.reserve.outputs.publish }}
      release_id: ${{ steps.reserve.outputs.release_id }}
      restored: ${{ steps.restore.outputs.restored }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the release App configuration
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
        run: test -n "$APP_ID" || { echo 'Configure the release App using docs/release-bot-setup.md'; exit 1; }
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - id: reserve
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 -m scripts.ci.release_state reserve
      - id: restore
        if: steps.reserve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_ID: ${{ steps.reserve.outputs.release_id }}
        run: python3 -m scripts.ci.release_state restore --release-id "$RELEASE_ID" --directory release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.restore.outputs.restored == 'true'
        with:
          name: reserved-distributions
          path: release/
          if-no-files-found: error
          overwrite: true

  source-tests:
    needs: reserve
    if: always() && !cancelled() && (needs.reserve.result == 'success' || github.event_name != 'push')
    name: source-tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.reserve.outputs.revision || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Check interpreter and run source tests
        run: |
          mkdir -p reports
          uv run --no-sync python -c 'import os, sys; assert f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["UV_PYTHON"]'
          uv run --no-sync python -m pytest -m "not smoke" -ra --junitxml=reports/pytest.xml 2>&1 | tee reports/source.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-tests-${{ matrix.python }}-${{ github.run_attempt }}
          path: reports/

  build:
    needs: reserve
    if: always() && !cancelled() && (needs.reserve.result == 'success' || github.event_name != 'push')
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.13"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.reserve.outputs.revision || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.reserve.outputs.restored == 'true'
        with:
          name: reserved-distributions
          path: release/
      - name: Build distributions and manifest
        if: needs.reserve.outputs.restored != 'true'
        run: python3 scripts/ci/build_release.py --output release
      - name: Check package metadata
        run: uvx --from twine==7.0.0 twine check --strict release/dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: release/
          if-no-files-found: error
          overwrite: true

  distribution-tests:
    name: distribution-tests (${{ matrix.python }}, ${{ matrix.format }})
    needs: [build, reserve]
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        format: [wheel, sdist]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.reserve.outputs.revision || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: release/
      - name: Install and probe the distribution
        env:
          TEST_PYTHON: ${{ matrix.python }}
          DIST_FORMAT: ${{ matrix.format }}
        run: |
          mkdir -p reports
          python3 scripts/ci/verify_distribution.py --release-dir release --python-version "$TEST_PYTHON" --format "$DIST_FORMAT" 2>&1 | tee reports/distribution.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: distribution-tests-${{ matrix.python }}-${{ matrix.format }}-${{ github.run_attempt }}
          path: reports/

  compatibility:
    name: compatibility
    needs: [source-tests, build, distribution-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix and build to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          assert all(job["result"] == "success" for job in results.values()), results
          PY

  persist:
    name: retain-release-artifacts
    needs: [reserve, compatibility]
    if: needs.reserve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: release/
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.reserve.outputs.release_id }}
        run: python3 -m scripts.ci.release_state persist --release-id "$RELEASE_ID" --directory release

  publish:
    name: publish-testpypi
    needs: [persist, reserve, build]
    if: needs.reserve.outputs.publish == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/k-commerce/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: release/
      - name: Publish tested artifacts with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release/dist/
          skip-existing: true

  verify-testpypi:
    name: verify-testpypi (${{ matrix.python }})
    needs: [publish, build, reserve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.reserve.outputs.revision || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: expected/
      - name: Download and verify published bytes
        run: |
          mkdir -p reports
          python3 scripts/ci/fetch_testpypi.py --manifest expected/release.json --output published 2>&1 | tee reports/download.log
      - name: Install the published wheel and probe MCP
        env:
          TEST_PYTHON: ${{ matrix.python }}
        run: python3 scripts/ci/verify_distribution.py --release-dir published --python-version "$TEST_PYTHON" --format wheel 2>&1 | tee reports/install.log
      - name: Write deployment summary
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          commit = json.loads(Path("published/release.json").read_text())["commit"]
          version = os.environ["RELEASE_VERSION"]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as report:
              report.write(f"Verified k-commerce {version}\n\nCommit: {commit}\n\n")
              report.write(f"https://test.pypi.org/project/k-commerce/{version}/\n\n")
              report.write("Download only this package from TestPyPI, then install dependencies from PyPI:\n\n```bash\n")
              report.write(f"python3 -m pip download --no-deps --only-binary=:all: --index-url https://test.pypi.org/simple/ k-commerce=={version} -d download\n")
              report.write(f"python3 -m pip install --index-url https://pypi.org/simple/ download/k_commerce-{version}-py3-none-any.whl\n```\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: testpypi-${{ matrix.python }}-${{ github.run_attempt }}
          path: reports/

  complete:
    name: complete-testpypi-release
    needs: [reserve, verify-testpypi]
    if: needs.reserve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_ID: ${{ needs.reserve.outputs.release_id }}
        run: python3 -m scripts.ci.release_state complete --release-id "$RELEASE_ID"
