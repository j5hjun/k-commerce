[project]
name = "k-commerce-cli"
dynamic = ["version"]
description = "CLI for K-Commerce workflows."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "anyio",
  "asyncclick",
  "langchain-ibm",
  "nodriver",
  "questionary",
]

[project.scripts]
k-commerce = "k_commerce_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../../VERSION"
pattern = "^(?P<version>.+)$"
