[project]
name = "k-commerce-mcp"
dynamic = ["version"]
description = "MCP server for K-commerce workflows."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "k-commerce-cli",
  "mcp[cli]>=1.28,<2",
]

[project.scripts]
k-commerce-mcp = "k_commerce_mcp.server:main"

[tool.uv.sources]
k-commerce-cli = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../../VERSION"
pattern = "^(?P<version>.+)$"
