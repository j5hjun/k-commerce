[project]
name = "k-commerce"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "k-commerce-cli",
  "k-commerce-mcp",
]

[tool.uv.workspace]
members = [
  "packages/cli",
  "packages/mcp",
]

[tool.uv.sources]
k-commerce-cli = { workspace = true }
k-commerce-mcp = { workspace = true }

[tool.ruff]
line-length = 200

[tool.pytest.ini_options]
testpaths = ["tests"]
