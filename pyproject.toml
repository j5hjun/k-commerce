[project]
name = "k-commerce"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "k-commerce-cli",
  "k-commerce-mcp",
  "k-commerce-agent",
]

[tool.uv.workspace]
members = [
  "packages/cli",
  "packages/mcp",
  "packages/agent",
]

[tool.uv.sources]
k-commerce-cli = { workspace = true }
k-commerce-mcp = { workspace = true }
k-commerce-agent = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.4.1",
]

[tool.ruff]
line-length = 200

[tool.pytest.ini_options]
testpaths = [
  "packages/cli/tests",
  "packages/mcp/tests",
  "packages/agent/tests",
]
markers = [
  "smoke: opt-in smoke tests that launch the real browser or depend on local credentials/session state",
]
